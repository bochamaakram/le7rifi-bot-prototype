[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "le7rayfi-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.121,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
 "sqlalchemy>=2.0.36,<2.1", "psycopg[binary]>=3.2,<4", "pgvector>=0.3.6,<1",
 "alembic>=1.14,<2", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
 "PyJWT[crypto]>=2.10,<3", "pypdf>=5.2,<7"
]
[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2"]
o2switch = ["a2wsgi>=1.10,<2"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
